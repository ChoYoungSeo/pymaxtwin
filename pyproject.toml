[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymaxtwin"
version = "0.1.0"
description = "Robust deterministic data splitting for model validation"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "V. Roshan Joseph", email = "roshan@gatech.edu"},
    {name = "Youngseo Cho", email = "ycho397@gatech.edu"},
]
keywords = ["data-splitting", "cross-validation", "model-validation", "twinning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "twinning>=1.0",
]

[project.urls]
Homepage = "https://github.com/ChoYoungSeo/pymaxtwin"
Repository = "https://github.com/ChoYoungSeo/pymaxtwin"
Issues = "https://github.com/ChoYoungSeo/pymaxtwin/issues"
Paper = "https://doi.org/10.1080/10618600.2026.2754089"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
